# Keeps the major tag (v1, v2, ...) pointing at the newest release in that
# major version, so releasing is just "publish a release" in GitHub's UI.
# Publishing v1.2.0 moves v1 to it; publishing an older patch like v1.1.1
# after v1.2.0 leaves v1 where it is.

name: major-tag

on:
  release:
    types: [published]

permissions:
  contents: write # to push the major tag

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  move:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Credentials are kept (unlike the shared workflows) because this job
      # pushes a tag. It only ever checks out this repo's own release tag.
      - uses: actions/checkout@v7

      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG isn't a vX.Y.Z version; leaving major tags alone."
            exit 0
          fi
          major="${TAG%%.*}"

          newest=$(git ls-remote --tags --refs origin "refs/tags/${major}.*" \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [[ "$TAG" != "$newest" ]]; then
            echo "$TAG is older than $newest; leaving $major where it is."
            exit 0
          fi

          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $TAG."
