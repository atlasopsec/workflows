# This repo's own PR title check. Separate from ci.yml because it needs the
# pull_request_target trigger, and it calls the shared workflow by local path.

name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Grouped by PR number: under pull_request_target, github.ref is the base
# branch, so it would put every open PR in one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: ./.github/workflows/pr-title.yml
