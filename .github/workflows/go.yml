# Checks a Go module: formatting, lint, sqlc generated code, known
# vulnerabilities, and tests with the race detector. Runs the same commands as
# `make lint` and `make test` in the Makefile template.
#
# Tools run with `go tool`, so the calling module must list goimports,
# golangci-lint, govulncheck, and (if it uses sqlc) sqlc as `tool` lines in
# its go.mod, or in a separate tools module named by `tools-modfile`.
# Libraries use the separate module, so projects that import them don't
# inherit the tools. Go's version comes from the calling module's go.mod.

name: go

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder containing go.mod
        type: string
        default: api
      tools-modfile:
        description: >-
          go.mod of a separate tools module, relative to working-directory
          (for example tools/go.mod). Empty means the tools are in the
          module's own go.mod.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TOOL: go tool${{ inputs.tools-modfile != '' && format(' -modfile={0}', inputs.tools-modfile) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/**/go.sum

      - name: Check formatting
        run: |
          out=$($TOOL goimports -l .)
          if [ -n "$out" ]; then
            echo "Not formatted (run make fmt):"
            echo "$out"
            exit 1
          fi

      - name: Lint
        run: $TOOL golangci-lint run

      - name: Check sqlc generated code is up to date
        if: hashFiles(format('{0}/sqlc.yaml', inputs.working-directory)) != ''
        run: $TOOL sqlc diff

      - name: Check for known vulnerabilities
        run: $TOOL govulncheck ./...

      # -count=1 so tests always run. Go can't see an external database or
      # service as a test input, so a cached result restored from an earlier
      # run could skip tests that would now fail.
      - name: Test
        run: go test -race -count=1 ./...
