# Scans the repo's full git history for committed secrets.
#
# Runs the gitleaks Docker image directly instead of gitleaks-action, because
# gitleaks-action requires a license key for organization repos. Findings that
# aren't real secrets go in a .gitleaksignore file at the calling repo's root.

name: gitleaks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
          persist-credentials: false

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose
